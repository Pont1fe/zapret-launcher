# Build and test on every push; a vX.Y.Z tag publishes a release with ZapretLauncherSetup.exe and ZapretLauncher.exe
# (keep the inline scripts ASCII-only: Windows PowerShell on the runner reads them in the ANSI code page)
#
# Code signing (SignPath Foundation, see docs/SIGNING.md) runs only for release tags and only when the repository has
# the secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG.
# Without them releases are published unsigned, as before. Order: sign the launcher, rebuild the installer around the
# signed launcher (it is what gets installed), then sign the installer. Each signing request waits for manual approval.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: ./build.ps1

      # logic tests on the built exe (no window, no winws/VPN); a failure stops the release
      - name: Tests
        shell: powershell
        run: ./tests/run.ps1

      - name: Check that the version matches the tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $file = (Get-Item dist/ZapretLauncher.exe).VersionInfo.FileVersion
          $v = $file -replace '\.0$', ''
          if ("v$v" -ne '${{ github.ref_name }}') { throw "AppVersion $v does not match tag ${{ github.ref_name }} - update app/App.cs" }
          "file=$file" >> $env:GITHUB_OUTPUT

      # ---------- code signing: launcher ----------
      - name: Upload launcher for signing
        id: unsigned-launcher
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-launcher
          path: dist/ZapretLauncher.exe

      - name: Sign launcher (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: launcher
          github-artifact-id: ${{ steps.unsigned-launcher.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-launcher
          parameters: |
            version: "${{ steps.version.outputs.file }}"

      - name: Rebuild the installer around the signed launcher
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Copy-Item signed-launcher/ZapretLauncher.exe dist/ZapretLauncher.exe -Force
          if ((Get-AuthenticodeSignature dist/ZapretLauncher.exe).Status -ne 'Valid') { throw 'The launcher came back without a valid signature' }
          ./build.ps1 -InstallerOnly

      # ---------- code signing: installer ----------
      - name: Upload installer for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/ZapretLauncherSetup.exe

      - name: Sign installer (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-setup
          parameters: |
            version: "${{ steps.version.outputs.file }}"

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Copy-Item signed-setup/ZapretLauncherSetup.exe dist/ZapretLauncherSetup.exe -Force
          foreach ($f in 'dist/ZapretLauncher.exe', 'dist/ZapretLauncherSetup.exe') {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f is not signed: $($s.Status)" }
            "$f signed by $($s.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ZapretLauncher
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/ZapretLauncherSetup.exe dist/ZapretLauncher.exe --title 'Zapret Launcher ${{ github.ref_name }}' --notes-file RELEASE_NOTES.md --latest
