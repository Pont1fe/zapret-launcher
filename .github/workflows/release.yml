# Build and test on every push; a vX.Y.Z tag publishes a release with ZapretLauncherSetup.exe and ZapretLauncher.exe
# (keep the inline scripts ASCII-only: Windows PowerShell on the runner reads them in the ANSI code page)
#
# Code signing (SignPath Foundation, see docs/SIGNING.md) runs only for release tags and only when the repository has
# the secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG.
# Without them releases are published unsigned, as before. Order: sign the launcher, rebuild the installer around the
# signed launcher (it is what gets installed), then sign the installer. Each signing request waits for manual approval.
#
# VirusTotal (tools/virustotal.ps1) runs only for release tags and only when the repository has the secret VT_API_KEY:
# the final files are sent before publishing, the release notes get links to their scans, and after publishing the
# scan result goes to the job summary. VirusTotal errors never stop a release.
#
# After publishing, tools/packages.ps1 writes the Scoop bucket (bucket/) and winget manifests (packaging/winget/) for the
# new installer and commits them to main. With the secret WINGET_TOKEN (a GitHub token with public_repo) the new version is
# also submitted to microsoft/winget-pkgs; the very first version has to be submitted by hand (wingetcreate submit).
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      VT: ${{ secrets.VT_API_KEY != '' }}
      WINGET: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: ./build.ps1

      # logic tests on the built exe (no window, no winws/VPN); a failure stops the release
      - name: Tests
        shell: powershell
        run: ./tests/run.ps1

      # the real window in demo mode: clicks, page navigation, drag area, 130% scale; skips itself if no desktop is available
      - name: UI tests
        shell: powershell
        run: powershell -STA -NoProfile -ExecutionPolicy Bypass -File ./tests/ui.ps1; exit $LASTEXITCODE

      - name: Check that the version matches the tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $file = (Get-Item dist/ZapretLauncher.exe).VersionInfo.FileVersion
          $v = $file -replace '\.0$', ''
          if ("v$v" -ne '${{ github.ref_name }}') { throw "AppVersion $v does not match tag ${{ github.ref_name }} - update app/App.cs" }
          "file=$file" >> $env:GITHUB_OUTPUT

      # ---------- code signing: launcher ----------
      - name: Upload launcher for signing
        id: unsigned-launcher
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-launcher
          path: dist/ZapretLauncher.exe

      - name: Sign launcher (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: launcher
          github-artifact-id: ${{ steps.unsigned-launcher.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-launcher
          parameters: |
            version: "${{ steps.version.outputs.file }}"

      - name: Rebuild the installer around the signed launcher
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Copy-Item signed-launcher/ZapretLauncher.exe dist/ZapretLauncher.exe -Force
          if ((Get-AuthenticodeSignature dist/ZapretLauncher.exe).Status -ne 'Valid') { throw 'The launcher came back without a valid signature' }
          ./build.ps1 -InstallerOnly

      # ---------- code signing: installer ----------
      - name: Upload installer for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/ZapretLauncherSetup.exe

      - name: Sign installer (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-setup
          parameters: |
            version: "${{ steps.version.outputs.file }}"

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Copy-Item signed-setup/ZapretLauncherSetup.exe dist/ZapretLauncherSetup.exe -Force
          foreach ($f in 'dist/ZapretLauncher.exe', 'dist/ZapretLauncherSetup.exe') {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f is not signed: $($s.Status)" }
            "$f signed by $($s.SignerCertificate.Subject)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ZapretLauncher
          path: dist/*.exe

      # ---------- VirusTotal: links in the release notes, result in the job summary ----------
      - name: Send the release files to VirusTotal
        if: startsWith(github.ref, 'refs/tags/v') && env.VT == 'true'
        continue-on-error: true
        shell: powershell
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./tools/virustotal.ps1 -Files dist/ZapretLauncherSetup.exe, dist/ZapretLauncher.exe -NotesIn RELEASE_NOTES.md -NotesOut release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'RELEASE_NOTES.md'
          if (Test-Path release-notes.md) { $notes = 'release-notes.md' }
          gh release create '${{ github.ref_name }}' dist/ZapretLauncherSetup.exe dist/ZapretLauncher.exe --title 'Zapret Launcher ${{ github.ref_name }}' --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

      # ---------- Scoop and winget: manifests with the new installer's SHA256 ----------
      # bucket/ is the Scoop bucket (scoop bucket add zapret-launcher https://github.com/Pont1fe/zapret-launcher);
      # packaging/winget/ is for the first manual winget submission. [skip ci]: the commit must not start another build
      - name: Update Scoop and winget manifests
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: powershell
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          Copy-Item dist/ZapretLauncherSetup.exe "$env:RUNNER_TEMP/setup.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          ./tools/packages.ps1 -Version $v -Installer "$env:RUNNER_TEMP/setup.exe"
          git add bucket packaging
          git commit -m "Scoop and winget manifests for $v [skip ci]"
          if ($LASTEXITCODE -eq 0) { git push origin main; if ($LASTEXITCODE -ne 0) { throw 'git push failed' } }

      # new versions go to winget by themselves once the package is there (the first version is submitted by hand)
      - name: Submit to winget
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET == 'true'
        continue-on-error: true
        shell: powershell
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile "$env:RUNNER_TEMP/wingetcreate.exe"
          & "$env:RUNNER_TEMP/wingetcreate.exe" update Pont1fe.ZapretLauncher --version $v --urls "https://github.com/Pont1fe/zapret-launcher/releases/download/v$v/ZapretLauncherSetup.exe" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'wingetcreate failed' }

      - name: VirusTotal result
        if: startsWith(github.ref, 'refs/tags/v') && env.VT == 'true'
        continue-on-error: true
        shell: powershell
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./tools/virustotal.ps1 -Report
