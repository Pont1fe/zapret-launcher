name: Windows WFP tunnel test
on:
  push:
    branches:
      - ci/wfp-tunnel-probe

permissions:
  contents: read

jobs:
  wfp:
    name: ${{ matrix.scenario }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [network, launcher]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build launcher
        run: ./build.ps1
      - name: Prepare test tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') {
            throw 'Unexpected sing-box checksum.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
      - name: Verify TCP and UDP on IPv4 and IPv6 through a crash and adapter replacement
        if: matrix.scenario == 'network'
        shell: pwsh
        run: |
          $core = Join-Path $env:RUNNER_TEMP 'sing-box-1.14.4-windows-amd64/sing-box.exe'
          ./tests/wfp-hosted.ps1 -VpnCore $core
      - name: Validate the pre-reboot WFP fixture and cleanup
        if: matrix.scenario == 'network'
        shell: pwsh
        run: |
          try {
            ./tests/wfp-reboot.ps1 -Phase Arm -DedicatedVm -PeerAddress 1.0.0.1 -PeerPort 443
          } finally {
            ./tests/wfp-reboot.ps1 -Phase Clear -DedicatedVm
          }
      - name: Verify launcher controls and automatic VPN recovery
        if: matrix.scenario == 'launcher'
        timeout-minutes: 4
        shell: powershell
        run: |
          $core = Join-Path $env:RUNNER_TEMP 'sing-box-1.14.4-windows-amd64/sing-box.exe'
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File tests/vpn-live-ui.ps1 -VpnCore $core
          exit $LASTEXITCODE
